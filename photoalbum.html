<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포토앨범</title>
    <link rel="stylesheet" href="css/reset.css">
    <script src="../js/jquery-4.0.0.min.js"></script>

    <style>
        body {
            background: #111;
            color: #000;
        }

        .container {
            max-width: 980px;
            margin: 50px auto;
            display: flex;
            justify-content: space-between;
        }

        .container nav {
            width: 30%;
        }

        .container nav ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .container nav ul li {
            width: 48%;
            height: 90px;
            margin-bottom: 4%;
        }

        .container nav ul li img {
            width: 100%;
            height: 100%;
            padding: 4px;
            background: #fff;
            box-sizing: border-box;
        }

        .container main {
            position: relative;
            width: 65%;
            text-align: center;
        }

        .container main img {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            padding: 8px;
            background: #fff;
        }
    </style>
    </style>
</head>

<body>
    <div class="container">
        <nav>
            <ul>
                <li>
                    <a href="img/img01_b.png">
                        <img src="img/img01_2.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="img/img02_b.png">
                        <img src="img/img02_2.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="img/img03_b.png">
                        <img src="img/img03_2.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="img/img04_b.png">
                        <img src="img/img04_2.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="img/img05_b.png">
                        <img src="img/img05_2.png" alt="">
                    </a>
                </li>
                <li>
                    <a href="img/img06_b.png">
                        <img src="img/img06_s.png" alt="">
                    </a>
                </li>
            </ul>
        </nav>

        <main class="content">
            <img src="img/img01_b.png" alt="">
        </main>
    </div>

    <script>
        $(function () {
            /* 
                .before() /.after()
                - 선택한 요소의 앞과 뒤에 삽입
                - 요소를 넣기
                .remove() -> 선택한 요소를 지워버리기

                .next() / .prev() - 찾기
            */
            $('nav a').on('click', function (e) {
                e.preventDefault();

                //main> img 앞에 클릭한 a가 가지고 있는 href 경로를 넣어준다.
                $('main img').before(
                    "<img src='" +
                    $(this).attr('href')
                    + "'>");
                $('main img:last').fadeOut(100, function () {
                    $(this).remove();
                })
            })
        })
    </script>
</body>

</html>
